<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5BHEL · Moderator</title><style>body{background:#131b28;color:#f5ebd7;font:18px system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{max-width:430px;padding:30px;width:90%;background:#202d40;border:1px solid #c8a669;border-radius:18px;box-sizing:border-box}h1{color:#e5bd70}input,button{width:100%;box-sizing:border-box;padding:15px;font:inherit;border-radius:9px;margin:8px 0}button{background:#d7af67;border:0;font-weight:bold;cursor:pointer}#error{color:#ffc2bd}</style></head><body><main><h1>⚖️ 5BHEL vor Gericht</h1><h2>Moderator-Anmeldung</h2><p>Nur die Spielleitung darf die Gerichtsverhandlung steuern.</p><form id="form"><input id="password" type="password" placeholder="Moderator-Passwort" autocomplete="current-password" required><button>Spiel leiten</button></form><p id="error" role="alert"></p><p><a style="color:#e5bd70" href="/abstimmen.html">Als Schüler teilnehmen</a></p></main><script>fetch('/api/admin-status').then(r=>r.json()).then(x=>{if(x.admin)location.replace('/')});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.replace('/');else document.getElementById('error').textContent='Passwort falsch oder Server nicht erreichbar.'}</script></body></html>
