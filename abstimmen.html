<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5BHEL – Abstimmen</title><style>body{background:#141b27;color:#f5eee1;font:18px system-ui;margin:0;padding:22px}main{max-width:520px;margin:30px auto}h1{color:#e8c47c}input,button{font:inherit;padding:15px;border-radius:10px;margin:7px 0;box-sizing:border-box;width:100%}input{background:#f6f1e7;border:0}button{background:#d9aa54;color:#181818;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}#choices button{background:#27374c;color:white;text-align:left;border:1px solid #b79a65}#status{padding:12px;min-height:2em}small{color:#b9bec7}</style></head><body><main><h1>⚖️ 5BHEL vor Gericht</h1><div id="login"><p>Mit deinem Namen und dem Raumcode teilnehmen.</p><input id="room" inputmode="numeric" maxlength="6" placeholder="6-stelliger Raumcode"><input id="name" maxlength="32" placeholder="Dein Name"><button id="join">Teilnehmen</button></div><div id="game" hidden><p>Angemeldet als <b id="who"></b></p><h2 id="title">Warte auf Prof. Lehrner …</h2><div id="choices"></div><p id="status" aria-live="polite"></p><small>Eine Stimme pro Frage. Nach der Abgabe ist sie verbindlich.</small></div></main><script src="js/cases.js"></script><script>
let code='',token='',lastKey='',voted=false;const $=id=>document.getElementById(id);async function api(endpoint,data){let r=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Fehler');return j}
$('room').value=new URLSearchParams(location.search).get('code')||'';
$('join').onclick=async()=>{try{code=$('room').value.trim();let j=await api('join',{code,name:$('name').value});token=j.token;$('who').textContent=j.name;$('login').hidden=true;$('game').hidden=false;await refresh();setInterval(refresh,1200)}catch(e){alert(e.message)}};
async function refresh(){try{let r=await fetch('/api/state?code='+encodeURIComponent(code));let j=await r.json();if(!r.ok)throw Error(j.error);let s=j.room;if(s.closed){$('title').textContent='Verhandlung beendet';$('choices').replaceChildren();return}if(!s.question){$('title').textContent='Warte auf die erste Frage …';return}let key=s.question.case+':'+s.question.question;if(key!==lastKey){lastKey=key;voted=false;let q=window.GAME_DATA.cases[s.question.case].questions[s.question.question];$('title').textContent='Fall '+(s.question.case+1)+' · Frage '+(s.question.question+1);$('choices').replaceChildren();q.answers.forEach((answer,i)=>{let b=document.createElement('button');b.textContent='ABC'[i]+' · '+answer;b.onclick=async()=>{try{await api('vote',{code,token,choice:i});voted=true;lock();$('status').textContent='Stimme abgegeben. Warte auf das Ergebnis.'}catch(e){$('status').textContent=e.message}};$('choices').append(b)});$('status').textContent='Wähle eine Antwort.'}if(!s.open){lock();$('status').textContent=s.winner===null?'Keine Stimmen abgegeben.':'Abstimmung beendet. Mehrheitsantwort: '+ 'ABC'[s.winner]}}catch(e){$('status').textContent='Verbindung unterbrochen – versuche erneut …'}}function lock(){$('choices').querySelectorAll('button').forEach(b=>b.disabled=true)}
</script></body></html>
